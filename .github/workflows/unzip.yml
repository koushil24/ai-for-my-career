name: Apply update.zip

on:
  push:
    paths:
      - 'update.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Unzip update.zip into the repository
        run: |
          set -e
          mkdir /tmp/unz
          unzip -o update.zip -d /tmp/unz
          cd /tmp/unz
          if [ "$(ls -A | wc -l)" -eq 1 ] && [ -d "$(ls -A | head -n 1)" ]; then
            cd "$(ls -A | head -n 1)"
          fi
          cp -a . "$GITHUB_WORKSPACE"/
          rm -f "$GITHUB_WORKSPACE/update.zip"

      - name: Commit the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply update from update.zip" || echo "Nothing to commit"
          git push
